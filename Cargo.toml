[package]
name = "ledgerstone"
version = "0.1.0"
license = "MIT"
edition = "2021"
description = "An embedded relational database in Rust: a hand-written SQL parser and executor over a typed, persistent table store, single file per database, no server."

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
